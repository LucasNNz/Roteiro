<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corvo Bridge — Configurações</title><link rel="stylesheet" href="ui.css"></head><body><main class="shell"><section class="card"><div class="brand"><div class="mark">🐦</div><div><h1>Corvo Bridge</h1><p>Uma ponte para os três especialistas do CorvoQuiz.</p></div></div><label>GPT DE IDEIAS<input id="gptIdeasUrl" type="url" placeholder="https://chatgpt.com/g/g-..."><small>URL do CORVO SCOUT que descobre e apresenta ideias.</small></label><label>GPT DE ROTEIRO<input id="gptScriptUrl" type="url" placeholder="https://chatgpt.com/g/g-..."><small>URL do agente que transforma a ideia aprovada em ROTEIRO.TXT.</small></label><label>GPT DE PROMPTS DE IMAGEM<input id="gptPromptsUrl" type="url" placeholder="https://chatgpt.com/g/g-..."><small>URL do agente que lê o roteiro e devolve as buscas para o coletor.</small></label><label>Origem do CorvoQuiz<input id="appOrigin" type="url" value="https://roteiro-mu.vercel.app"></label><label>Comportamento da aba<select id="openMode"><option value="reuse">Reutilizar a aba correta de cada GPT</option><option value="new">Abrir nova aba para cada trabalho</option></select></label><div class="actions"><button id="save">Salvar os três GPTs</button><span id="saved"></span></div><div class="note">Cada etapa abre o especialista correspondente. Todos devolvem pela mesma Action usando JOB_ID + resultado.</div></section></main><script src="options.js"></script></body></html>
