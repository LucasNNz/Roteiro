openapi: 3.1.0
info:
  title: CorvoQuiz Bridge API
  version: 3.0.0
  description: Recebe o resultado completo produzido pelo GPT e o devolve ao CorvoQuiz pelo mesmo jobId.
servers:
  - url: https://roteiro-mu.vercel.app
paths:
  /api/corvo/resultado:
    post:
      operationId: entregarResultadoCorvo
      summary: Entrega o resultado completo de um trabalho ao CorvoQuiz
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultadoRequest"
      responses:
        "200":
          description: Resultado recebido com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoResponse"
        "400":
          description: jobId ou resultado ausente
        "401":
          description: Chave da API inválida
        "404":
          description: Trabalho inexistente ou expirado
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ResultadoRequest:
      type: object
      additionalProperties: false
      properties:
        jobId:
          type: string
          description: JOB_ID recebido na mensagem CORVO_BRIDGE_JOB.
        resultado:
          type: string
          minLength: 1
          description: Conteúdo final completo produzido pelo GPT.
      required:
        - jobId
        - resultado
    ResultadoResponse:
      type: object
      properties:
        ok:
          type: boolean
        jobId:
          type: string
        status:
          type: string
        message:
          type: string
      required:
        - ok
        - jobId
        - status
        - message
